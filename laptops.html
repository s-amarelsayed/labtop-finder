<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue | Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
  <script type="module" src="src/js/laptops.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="page-width pb-12">
    <header class="py-8 lg:py-10">
      <h1 class="page-title">Laptop catalogue</h1>
      <p class="mt-3 text-muted">Search by name or brand, then narrow down the specs that matter to you.</p>
    </header>
    <div id="loading" role="status"></div>
    <div id="content" hidden>
      <form id="filters" class="panel grid grid-cols-1 gap-4 p-5 md:grid-cols-2 lg:grid-cols-[1.45fr_1fr_1fr_.9fr_1.25fr]">
        <label class="min-w-0 text-sm font-semibold md:col-span-2 lg:col-span-1">Search laptops
          <input class="field" id="search" type="search" placeholder="Name or brand" autocomplete="off">
        </label>
        <label class="min-w-0 text-sm font-semibold">Category
          <select class="field" id="category">
            <option value="">All categories</option>
            <option value="ultrabook">Ultrabook</option>
            <option value="gaming">Gaming</option>
            <option value="2-in-1">2-in-1</option>
            <option value="creator">Creator</option>
            <option value="budget">Budget</option>
          </select>
        </label>
        <label class="min-w-0 text-sm font-semibold">Max price (USD)
          <input class="field" type="number" min="0" step="any" id="max-price" placeholder="No limit">
        </label>
        <label class="min-w-0 text-sm font-semibold">Minimum RAM
          <select class="field" id="min-ram">
            <option value="0">Any RAM</option><option value="8">8 GB</option>
            <option value="16">16 GB</option><option value="24">24 GB</option><option value="32">32 GB</option>
          </select>
        </label>
        <label class="min-w-0 text-sm font-semibold">Sort by
          <select class="field" id="sort">
            <option value="">Catalogue order</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="batteryHours-desc">Battery: longest first</option>
            <option value="batteryHours-asc">Battery: shortest first</option>
            <option value="weightKg-asc">Weight: lightest first</option>
            <option value="weightKg-desc">Weight: heaviest first</option>
          </select>
        </label>
      </form>
      <div class="flex items-center justify-between gap-3 py-5">
        <p id="result-count" role="status" class="font-semibold"></p>
        <button type="button" class="text-link text-sm" id="reset">Reset filters</button>
      </div>
      <div id="cards" class="card-grid"></div>
      <p id="no-results" hidden class="panel p-8 text-center text-muted">No laptops match these filters. Try a different search or reset the filters.</p>
    </div>
  </main>
  <footer id="site-footer" class="mt-auto border-t border-line bg-card"></footer>
</body>
</html>
